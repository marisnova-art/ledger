async function loadSbLib(){
  if(window.__sbLib)return window.__sbLib;
  const srcs=['https://esm.sh/@supabase/supabase-js@2','https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'];
  let last;
  for(const u of srcs){try{const m=await import(u);window.__sbLib=m;return m}catch(e){last=e}}
  throw new Error('Supabase 라이브러리를 불러오지 못했어요. 인터넷 연결을 확인하세요.');
}
async function sbConnect(){
  if(!sync.url||!sync.anon){setSb('off');return}
  if(!navigator.onLine){setSb('offline','인터넷에 연결되면 자동으로 이어서 동기화해요');return}
  setSb('connecting');
  try{
    const {createClient}=await loadSbLib();
    sb=createClient(sync.url,sync.anon,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'ledger.auth'}});
    sb.auth.onAuthStateChange((ev)=>{if(ev==='SIGNED_OUT'){sbUser=null;unsubscribe();setSb('signin','로그인이 필요해요')}});
    const {data,error}=await sb.auth.getSession();
    if(error)throw error;
    if(data&&data.session)await sbAfterLogin(data.session.user);
    else setSb('signin','로그인이 필요해요');
  }catch(e){setSb('error',e.message||String(e))}
}
async function sbAfterLogin(user){
  sbUser=user;sync.email=user.email||'';saveSync();
  setSb('online');
  await sbPull(false);
  subscribe();
}
function subscribe(){
  unsubscribe();if(!sb||!sbUser)return;
  sbChan=sb.channel('ledger-'+sbUser.id)
    .on('postgres_changes',{event:'*',schema:'public',table:'ledger_state',filter:'user_id=eq.'+sbUser.id},payload=>{
      if(applyingRemote||sbBusy)return;
      const r=payload&&payload.new&&payload.new.rev;
      if(r&&r===sync.rev)return;
      sbPull(true);
    }).subscribe();
}
function unsubscribe(){if(sbChan&&sb){try{sb.removeChannel(sbChan)}catch(e){}}sbChan=null}
function applyRemote(row,fromOther){
  applyingRemote=true;
  root=normalizeRoot(row.data);bindActive();
  try{localStorage.setItem(KEY,JSON.stringify(root))}catch(e){}
  sync.rev=row.rev;sync.at=Date.now();saveSync();
  pendingPush=false;clearTimeout(pushTimer);
  applyingRemote=false;setSb('online');
  if(modalStack.length)pendingRender=true;else render();
  toast(fromOther?'다른 기기의 변경 내용을 불러왔어요':'서버 데이터를 불러왔어요');
}
async function sbPull(fromOther){
  if(!sb||!sbUser||sbBusy)return;
  sbBusy=true;
  try{
    const {data,error}=await sb.from('ledger_state').select('data,rev,updated_at').eq('user_id',sbUser.id).maybeSingle();
    if(error)throw error;
    if(!data){sbBusy=false;await sbPush(true);return}
    if(data.rev===sync.rev){setSb('online');if(pendingPush){sbBusy=false;await sbPush();return}return}
    if(pendingPush||(sync.rev===0&&totalTx())){
      const keep=await syncConflict(data);
      if(keep==='local'){sbBusy=false;await sbPush(true);return}
      if(keep!=='server'){setSb('online');return}
    }
    applyRemote(data,fromOther);
  }catch(e){setSb('error',e.message||String(e))}
  finally{sbBusy=false;paintSync()}
}
function schedulePush(){
  if(applyingRemote||!sb||!sbUser)return;
  pendingPush=true;paintSync();
  clearTimeout(pushTimer);pushTimer=setTimeout(()=>sbPush(),1000);
}
async function sbPush(force){
  if(!sb||!sbUser||sbBusy)return;
  if(!navigator.onLine){pendingPush=true;setSb('offline','인터넷에 연결되면 자동으로 올려요');return}
  sbBusy=true;setSb('syncing');
  try{
    const {data,error}=await sb.rpc('save_ledger',{p_data:root,p_base_rev:force?-1:sync.rev,p_device:deviceLabel()});
    if(error)throw error;
    if(data&&data.ok){sync.rev=data.rev;sync.at=Date.now();saveSync();pendingPush=false;setSb('online')}
    else if(data){
      const row={data:data.data,rev:data.rev,updated_at:data.updated_at};
      const keep=await syncConflict(row);
      if(keep==='server')applyRemote(row,true);
      else if(keep==='local'){sbBusy=false;await sbPush(true);return}
      else setSb('online','양쪽 내용이 아직 다릅니다');
    }
  }catch(e){setSb('error',e.message||String(e))}
  finally{sbBusy=false;paintSync()}
}
function syncConflict(row){
  const srv=normalizeRoot(row.data);const when=t=>t?new Date(t).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):'-';
  return new Promise(res=>{
    let out='cancel';
    openModal({title:'어느 쪽 내용을 쓸까요?',size:'sm',onClose:()=>res(out),
      html:`<p class="confirm-msg">이 기기와 서버의 내용이 서로 다릅니다. 고른 쪽으로 양쪽을 맞춥니다.</p>
      <ul class="facts" style="margin-bottom:22px">
        <li><span>서버 (다른 기기)</span><b class="num">장부 ${srv.books.length}개 · 거래 ${fmt(totalTx(srv))}건<br><span style="color:var(--muted);font-weight:600">${when(row.updated_at)}</span></b></li>
        <li><span>이 기기</span><b class="num">장부 ${root.books.length}개 · 거래 ${fmt(totalTx())}건<br><span style="color:var(--muted);font-weight:600">${when(root.savedAt)}</span></b></li></ul>
      <div class="form-actions"><button type="button" class="btn" data-k="server">서버 내용 사용</button><button type="button" class="btn btn-lime" data-k="local">이 기기 내용 사용</button></div>`,
      onMount(m,c){$$('[data-k]',m).forEach(b=>b.onclick=()=>{out=b.dataset.k;c()})}});
  });
}
const SYNC_SQL=`-- LEDGER 동기화 설치용 SQL
-- Supabase 대시보드 > SQL Editor 에 붙여넣고 한 번만 실행하세요.

create table if not exists public.ledger_state (
  user_id    uuid primary key references auth.users(id) on delete cascade,
  data       jsonb       not null default '{}'::jsonb,
  rev        bigint      not null default 1,
  device     text,
  updated_at timestamptz not null default now()
);

alter table public.ledger_state enable row level security;

drop policy if exists ledger_select_own on public.ledger_state;
create policy ledger_select_own on public.ledger_state
  for select using (auth.uid() = user_id);

drop policy if exists ledger_insert_own on public.ledger_state;
create policy ledger_insert_own on public.ledger_state
  for insert with check (auth.uid() = user_id);

drop policy if exists ledger_update_own on public.ledger_state;
create policy ledger_update_own on public.ledger_state
  for update using (auth.uid() = user_id) with check (auth.uid() = user_id);

drop policy if exists ledger_delete_own on public.ledger_state;
create policy ledger_delete_own on public.ledger_state
  for delete using (auth.uid() = user_id);

-- 버전(rev)을 확인하고 저장하는 함수. 두 기기가 동시에 고쳐도 덮어쓰기를 막습니다.
create or replace function public.save_ledger(p_data jsonb, p_base_rev bigint, p_device text default null)
returns jsonb
language plpgsql
security invoker
as $$
declare cur public.ledger_state;
begin
  select * into cur from public.ledger_state where user_id = auth.uid() for update;

  if not found then
    insert into public.ledger_state (user_id, data, rev, device)
    values (auth.uid(), p_data, 1, p_device)
    returning * into cur;
    return jsonb_build_object('ok', true, 'rev', cur.rev, 'updated_at', cur.updated_at);
  end if;

  if p_base_rev <> -1 and cur.rev <> p_base_rev then
    return jsonb_build_object('ok', false, 'rev', cur.rev,
                              'updated_at', cur.updated_at, 'data', cur.data);
  end if;

  update public.ledger_state
     set data = p_data, rev = cur.rev + 1, device = p_device, updated_at = now()
   where user_id = auth.uid()
  returning * into cur;

  return jsonb_build_object('ok', true, 'rev', cur.rev, 'updated_at', cur.updated_at);
end;
$$;

grant execute on function public.save_ledger(jsonb, bigint, text) to authenticated;

-- 실시간 반영 (한 기기에서 고치면 다른 기기에 바로 내려옵니다)
alter table public.ledger_state replica identity full;
do $$
begin
  alter publication supabase_realtime add table public.ledger_state;
exception when duplicate_object then null;
end $$;`;
function vSync(){
  const cfg=!!(sync.url&&sync.anon);
  return head('동기화','한 계정으로 로그인하면 휴대폰, 태블릿, PC가 모든 장부를 함께 씁니다. 인터넷이 끊겨도 이 기기에서 그대로 쓰고, 다시 연결되면 자동으로 올라갑니다.')+
  `<div id="sync-status"></div>
  <p class="note" style="margin-top:12px">${icon('alert',14)} 다중 장부가 들어간 새 버전이에요. 동기화하는 모든 기기에서 이 새 파일을 쓰세요. 예전 버전 파일이 서버 데이터를 저장하면 장부 구조가 덮어써질 수 있어요.</p>

        <div class="form-actions" style="margin-top:18px"><button type="button" class="btn" data-act="sync-out">로그아웃</button></div>`
      :`<form id="auth-form" class="txform" novalidate>
        <div class="field"><label for="sb-email">이메일</label><input type="text" id="sb-email" inputmode="email" autocomplete="username" value="${esc(sync.email)}"></div>
        <div class="field"><label for="sb-pw">비밀번호</label><input type="password" id="sb-pw" autocomplete="current-password" placeholder="6자 이상"></div>
        <span class="field-err" id="auth-err"></span>
        <div class="form-actions"><button type="button" class="btn btn-ghost" id="btn-signup">계정 만들기</button><button type="submit" class="btn btn-lime">로그인</button></div>
      </form>
      <p class="hint" style="margin-top:12px">혼자 쓰는 앱이니 계정은 하나만 만들면 됩니다. 계정을 만든 뒤 Authentication → Sign In / Providers 에서 신규 가입을 꺼 두세요.</p>`}
    </section>
  </div>
  <section class="card" style="margin-top:16px"><div class="card-h"><h2>준비 순서</h2></div>
    <ol class="steps">
      <li><span><b>supabase.com</b> 에서 프로젝트를 만듭니다.</span></li>

    </ol></section>
  <section class="card" style="margin-top:16px"><div class="card-h"><h2>설치용 SQL</h2><button class="btn btn-sm" data-act="sql-copy">${icon('file',16)}SQL 복사</button></div>
    <pre class="code">${esc(SYNC_SQL)}</pre></section>`;
}
function mSync(){
  paintSync();
  const cf=$('#cfg-form');
  if(cf)cf.addEventListener('submit',async e=>{e.preventDefault();
    const u=$('#sb-url').value.trim().replace(/\/+$/,''),k=$('#sb-key').value.trim();
    if(!/^https:\/\/\S+$/.test(u)){$('#cfg-err').textContent='https:// 로 시작하는 Project URL을 넣어 주세요';return}
    if(k.length<20){$('#cfg-err').textContent='anon public key를 넣어 주세요';return}
    $('#cfg-err').textContent='';
    if(u!==sync.url)sync.rev=0;
    sync.url=u;sync.anon=k;saveSync();
    unsubscribe();sb=null;sbUser=null;
    await sbConnect();render();
  });
  const af=$('#auth-form');
  if(af){
    const go=async mode=>{
      const email=$('#sb-email').value.trim(),pw=$('#sb-pw').value;
      const err=m=>{const el=$('#auth-err');if(el)el.textContent=m};
      err('');
      if(!email||!pw){err('이메일과 비밀번호를 모두 넣어 주세요');return}
      if(!sync.url||!sync.anon){err('먼저 왼쪽에서 프로젝트를 연결하세요');return}
      if(!sb)await sbConnect();
      if(!sb){err(sbMsg||'프로젝트에 연결하지 못했어요');return}
      setSb('connecting');
      try{
        const r=mode==='up'?await sb.auth.signUp({email,password:pw}):await sb.auth.signInWithPassword({email,password:pw});
        if(r.error)throw r.error;
        sync.email=email;saveSync();
        if(!r.data.session){setSb('signin','메일로 온 확인 링크를 누른 뒤 로그인하세요');toast('확인 메일을 보냈어요');return}
        await sbAfterLogin(r.data.session.user);render();toast('로그인했어요');
      }catch(ex){const m=ex.message||String(ex);setSb('error',m);err(m)}
    };
    af.addEventListener('submit',e=>{e.preventDefault();go('in')});
    $('#btn-signup').addEventListener('click',()=>go('up'));
  }
}
window.addEventListener('online',()=>{if(sync.url&&sync.anon){if(sb&&sbUser){setSb('online');sbPull(false)}else sbConnect()}});
window.addEventListener('offline',()=>{if(sync.url&&sync.anon)setSb('offline','인터넷에 연결되면 자동으로 이어서 동기화해요')});

/* ---------- PWA: 설치 · 오프라인 · 업데이트 ---------- */
const pwa={
  prompt:null,reg:null,waiting:null,refreshing:false,persisted:null,
  canSW:'serviceWorker' in navigator&&/^https?:$/.test(location.protocol)&&(window.isSecureContext||location.hostname==='localhost'),
  standalone:()=>window.matchMedia('(display-mode: standalone)').matches||window.matchMedia('(display-mode: minimal-ui)').matches||navigator.standalone===true,
  ios:/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1),
  installedAt:(()=>{try{return +localStorage.getItem('ledger.pwa.installed')||0}catch(e){return 0}})()
};
function pwaPaint(){
  const can=!!pwa.prompt&&!pwa.standalone();
  const side=$('#pwa-side'),m=$('#pwa-m');
  if(side){side.hidden=!can;side.innerHTML=`${icon('install',16,2.2)}<span>앱으로 설치</span>`}
  if(m){m.hidden=!can;m.innerHTML=icon('install',20,2.2)}
  if(current==='data'){const c=$('#pwa-card');if(c)c.outerHTML=pwaCard()}
}
function pwaCard(){
  const st=pwa.standalone();
  const pills=[];
  pills.push(st?`<span class="pill lime">${icon('check',12,2.6)}앱으로 실행 중</span>`:`<span class="pill">브라우저에서 실행 중</span>`);
  if(pwa.canSW)pills.push(navigator.serviceWorker.controller?`<span class="pill lime">오프라인 사용 가능</span>`:`<span class="pill">오프라인 준비 중</span>`);
  if(pwa.persisted===true)pills.push(`<span class="pill lime">저장공간 보호됨</span>`);
  let body,acts='';
  if(!pwa.canSW){
    body=`<p>앱 설치와 오프라인 실행은 <b style="color:var(--text)">https 주소</b>로 열었을 때만 쓸 수 있어요. 파일을 직접 열면(file://) 동작하지 않습니다. GitHub Pages, Netlify, Cloudflare Pages 같은 곳에 폴더째 올려 주세요.</p>`;
  }else if(st){
    body=`<p>홈 화면 앱으로 실행 중이에요. 인터넷이 끊겨도 기록과 조회가 되고, 연결되면 동기화가 이어집니다.</p>`;
    acts=`<button class="btn" data-act="pwa-check">${icon('reset',17)}업데이트 확인</button>${pwa.persisted===true?'':`<button class="btn" data-act="pwa-persist">저장공간 보호</button>`}`;
  }else if(pwa.prompt){
    body=`<p>LEDGER를 휴대폰 홈 화면이나 PC 앱 목록에 설치합니다. 주소창 없이 전체 화면으로 열리고, 인터넷이 없어도 쓸 수 있어요.</p>`;
    acts=`<button class="btn btn-lime" data-act="pwa-install">${icon('install',17,2.2)}앱으로 설치</button>`;
  }else if(pwa.ios){
    body=`<p>iPhone·iPad에서는 Safari에서 직접 추가합니다.</p><ol><li>아래쪽(또는 위쪽)의 <b>공유</b> ${icon('share',15,2)} 버튼을 누릅니다.</li><li><b>홈 화면에 추가</b>를 고릅니다.</li><li>오른쪽 위 <b>추가</b>를 누르면 끝이에요.</li></ol>`;
  }else{
    body=`<p>브라우저 주소창 오른쪽의 <b style="color:var(--text)">설치</b> 아이콘이나, 메뉴의 <b style="color:var(--text)">앱 설치 / 홈 화면에 추가</b>로 설치할 수 있어요. ${pwa.installedAt?'이미 설치했다면 앱 목록에서 LEDGER를 여세요.':''}</p>`;
  }
  return `<article class="card data-card pwa-card" id="pwa-card"><div class="d-ic">${icon('install',22)}</div><h3>앱으로 설치</h3><div class="pwa-state">${pills.join('')}</div>${body}${acts?`<div class="pwa-acts">${acts}</div>`:''}</article>`;
}
function pwaShowUpdate(worker){
  pwa.waiting=worker;const bar=$('#upd-bar');if(!bar)return;
  bar.innerHTML=`${icon('spark',18)}<span>새 버전이 준비됐어요</span><button class="btn btn-lime" data-act="pwa-update">새로고침</button><button class="icon-btn" data-act="pwa-later" aria-label="나중에" title="나중에">${icon('x',16)}</button>`;
  bar.hidden=false;
}
function pwaTrack(reg){
  if(reg.waiting&&navigator.serviceWorker.controller)pwaShowUpdate(reg.waiting);
  reg.addEventListener('updatefound',()=>{const w=reg.installing;if(!w)return;
    w.addEventListener('statechange',()=>{if(w.state==='installed'){if(navigator.serviceWorker.controller)pwaShowUpdate(w);else{pwaPaint()}}})});
}
async function pwaPersist(ask){
  if(!navigator.storage||!navigator.storage.persisted)return;
  try{pwa.persisted=await navigator.storage.persisted();if(!pwa.persisted&&ask)pwa.persisted=await navigator.storage.persist()}catch(e){}
}
async function pwaInit(){
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();pwa.prompt=e;pwaPaint()});
  window.addEventListener('appinstalled',()=>{pwa.prompt=null;try{localStorage.setItem('ledger.pwa.installed',String(Date.now()))}catch(e){}pwaPersist(true).then(pwaPaint);toast('LEDGER를 앱으로 설치했어요')});
  window.matchMedia('(display-mode: standalone)').addEventListener?.('change',pwaPaint);
  await pwaPersist(pwa.standalone()||!!pwa.installedAt);
  if(!pwa.canSW){pwaPaint();return}
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(pwa.refreshing)return;if(pwa.waiting){pwa.refreshing=true;location.reload()}else pwaPaint()});
  try{
    pwa.reg=await navigator.serviceWorker.register('sw.js',{scope:'./'});
    pwaTrack(pwa.reg);
    // 앱을 오래 켜 두거나 다시 열 때 새 버전 확인
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&pwa.reg)pwa.reg.update().catch(()=>{})});
    setInterval(()=>{if(pwa.reg&&navigator.onLine)pwa.reg.update().catch(()=>{})},60*60*1000);
  }catch(e){console.warn('SW 등록 실패',e)}
  pwaPaint();
}
Object.assign(ACTIONS,{
  'pwa-install':async()=>{
    if(!pwa.prompt){go('data');return}
    const p=pwa.prompt;pwa.prompt=null;
    try{await p.prompt();const r=await p.userChoice;if(r&&r.outcome==='dismissed')toast('설치를 취소했어요. 데이터 관리에서 언제든 다시 설치할 수 있어요.')}catch(e){}
    pwaPaint();
  },
  'pwa-update':async()=>{const w=pwa.waiting||(pwa.reg&&pwa.reg.waiting);if(!w){location.reload();return}
    // 올리지 못한 변경이 있으면 먼저 서버에 올리고 새로고침
    if((pendingPush||pushTimer)&&sb&&sbUser&&navigator.onLine){try{clearTimeout(pushTimer);pushTimer=null;await sbPush(false)}catch(e){}}
    w.postMessage({type:'SKIP_WAITING'});const bar=$('#upd-bar');if(bar)bar.innerHTML=`${icon('reset',18)}<span>업데이트하는 중…</span>`},
  'pwa-later':()=>{const bar=$('#upd-bar');if(bar)bar.hidden=true},
  'pwa-check':async()=>{if(!pwa.reg){toast('서비스 워커가 아직 준비되지 않았어요','err');return}
    if(!navigator.onLine){toast('인터넷에 연결된 뒤 다시 확인해 주세요','err');return}
    try{await pwa.reg.update();if(pwa.reg.installing||pwa.reg.waiting)toast('새 버전을 받는 중이에요');else toast('최신 버전이에요')}catch(e){toast('업데이트를 확인하지 못했어요','err')}},
  'pwa-persist':async()=>{await pwaPersist(true);pwaPaint();toast(pwa.persisted?'저장공간을 보호했어요. 브라우저가 임의로 지우지 않아요.':'브라우저가 아직 허용하지 않았어요. 앱으로 설치하면 대부분 허용됩니다.',pwa.persisted?'ok':'err')}
});
// 앱 바로가기(길게 누르기 메뉴)와 시작 주소 처리: ?action=new-tx / ?view=transactions
function pwaLaunchParams(){
  const q=new URLSearchParams(location.search);if(![...q.keys()].length)return null;
  const action=q.get('action'),view=q.get('view');
  const hash=view&&VIEWS[view]?'#/'+view:location.hash;
  try{history.replaceState(null,'',location.pathname+hash)}catch(e){}
  return action;
}
// 네트워크 상태 알림(동기화를 안 쓰는 경우에도 안심되도록)
window.addEventListener('offline',()=>{if(!(sync.url&&sync.anon))toast('오프라인이에요. 기록은 이 기기에 그대로 저장돼요.')});

/* ---------- boot ---------- */
buildNav();
if(!bootRaw||!Array.isArray(bootRaw.books))save({local:true});
const launchAction=pwaLaunchParams();
route();
sbConnect();
pwaInit();
if(launchAction==='new-tx')setTimeout(()=>openTxModal(),60);
else if(launchAction==='new-expense')setTimeout(()=>openTxModal(null,'expense'),60);
</script>
