<!doctype html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0C0D0B">
<title>LEDGER</title>
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="LEDGER">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="description" content="개인·사업자를 위한 장부와 자산 관리">
<meta name="format-detection" content="telephone=no">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="app/styles.css?v=2.0.0">
<script>try{var t=localStorage.getItem('ledger.v2.theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
</head>
<body>
<div id="app"></div>
<div id="splash" aria-hidden="true">
<style>
#splash{position:fixed;inset:0;z-index:999;display:grid;place-items:center;align-content:center;gap:14px;background:#0C0D0B;color:#F2F2EE;font-family:Pretendard Variable,Pretendard,system-ui,sans-serif;transition:opacity .35s ease}
[data-theme="light"] #splash{background:#EEEADD;color:#1A1B16}
@media (prefers-color-scheme:light){[data-theme="system"] #splash{background:#EEEADD;color:#1A1B16}}
#splash .sp-mark{width:76px;height:76px;border-radius:20px;background:#C6F432;display:grid;place-items:center;box-shadow:0 0 40px rgba(198,244,50,.25);animation:spIn .6s ease both}
#splash .sp-name{font-size:22px;letter-spacing:.18em;animation:spIn .6s .08s ease both}
#splash .sp-ver{position:absolute;left:0;right:0;bottom:calc(40px + env(safe-area-inset-bottom));text-align:center;font-size:17px;opacity:.8;letter-spacing:.02em}
#splash.out{opacity:0;pointer-events:none}
@keyframes spIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
<div class="sp-mark"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#0C0D0B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11M9 8h6"/></svg></div>
<div class="sp-name" id="spName">LEDGER</div>
<div class="sp-ver" id="spVer">&nbsp;</div>
</div>
<div id="layer"></div>
<noscript>이 앱은 자바스크립트가 필요해요.</noscript>
<script type="module" src="app/main.js?v=2.0.0"></script>
</body>
</html>
